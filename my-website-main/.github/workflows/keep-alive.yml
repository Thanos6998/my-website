name: Keep Render Alive

on:
schedule:
- cron: '*/5 * * * *'
workflow_dispatch:

jobs:
ping:
runs-on: ubuntu-latest

```
steps:
  - name: Ping backend
    run: |
      STATUS=$(curl --silent --output /dev/null \
      --write-out "%{http_code}" \
      https://my-website-g7nn.onrender.com/api/)

      echo "Status: $STATUS"

      if [ "$STATUS" != "200" ]; then
        echo "Failed"
        exit 1
      fi

      echo "Backend is alive"
```

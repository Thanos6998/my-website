```yaml id="t6x9pk"
name: Keep Render Alive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Backend
        run: |
          STATUS=$(curl --silent --output /dev/null \
          --write-out "%{http_code}" \
          ${{ secrets.RENDER_URL }}/health)

          echo "Status: $STATUS"

          if [ "$STATUS" != "200" ]; then
            echo "Backend is down"
            exit 1
          fi

          echo "Backend is alive"
```

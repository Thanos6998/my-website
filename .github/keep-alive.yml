name: Keep Render alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: |
          STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" https://my-website-g7nn.onrender.com/api/)
          echo "Status: $STATUS"
          if [ "$STATUS" -eq 200 ]; then
            echo "Backend is alive!"
          else
            echo "Got $STATUS, but ping was sent — Render will wake up."
          fi

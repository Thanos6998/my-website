name: Keep Render alive

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes
  workflow_dispatch:          # allows manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: |
          STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" https://my-website-g7nn.onrender.com)
          echo "Status: $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "Warning: got $STATUS, but continuing anyway"
          fi

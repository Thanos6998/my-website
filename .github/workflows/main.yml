name: Keep Render alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping backend
        run: |
          STATUS=$(curl --silent --output /dev/null \
            --write-out "%{http_code}" \
            ${{ secrets.RENDER_URL }}/health)

          echo "Status: $STATUS"

          if [ "$STATUS" != "200" ]; then
            echo "Failed"
            exit 1
          fi

          echo "Alive at $(date)"
